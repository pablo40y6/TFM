name: M4D source acquisition probe

on:
  push:
    branches: [milestone/m4d-design]
    paths: [.github/workflows/m4d-source-acquisition.yml]

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acquire Niro 2004 renormalization source
        shell: bash
        run: |
          set -u
          mkdir -p acquisition/files acquisition/diag
          : > acquisition/MANIFEST.txt
          note(){ printf '%s\n' "$*" | tee -a acquisition/MANIFEST.txt; }
          note "access_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          page='https://arts.mi.uni-hamburg.de/publications/all.php?keyword=linemixing&tagcloud=on'
          curl -fL --retry 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' "$page" -o acquisition/diag/arts_publications.html || true
          python3 -c "import re,html; s=open('acquisition/diag/arts_publications.html',encoding='utf-8',errors='replace').read(); m=re.search(r'href=[\"\x27]([^\"\x27]*niro04_spectra_i_jqsrt\.pdf)[\"\x27]',s,re.I); print(html.unescape(m.group(1)) if m else '')" > acquisition/diag/niro_href.txt || true
          href="$(head -n1 acquisition/diag/niro_href.txt || true)"
          note "discovered_href=$href"
          if [ -n "$href" ]; then
            python3 -c "from urllib.parse import urljoin; print(urljoin('$page','$href'))" > acquisition/diag/niro_url.txt
            url="$(head -n1 acquisition/diag/niro_url.txt)"
            note "resolved_url=$url"
            if curl -fL --retry 2 --connect-timeout 20 --max-time 180 -A 'Mozilla/5.0' "$url" -o acquisition/files/niro04_spectra_i_jqsrt.pdf; then
              note "status=downloaded"
              note "bytes=$(wc -c < acquisition/files/niro04_spectra_i_jqsrt.pdf)"
              note "sha256=$(sha256sum acquisition/files/niro04_spectra_i_jqsrt.pdf | awk '{print $1}')"
              note "type=$(file -b acquisition/files/niro04_spectra_i_jqsrt.pdf)"
              pdfinfo acquisition/files/niro04_spectra_i_jqsrt.pdf > acquisition/diag/niro_pdfinfo.txt 2>&1 || true
              pdftotext -layout acquisition/files/niro04_spectra_i_jqsrt.pdf acquisition/diag/niro.txt 2>/dev/null || true
              grep -Ein -A45 -B20 'renorm|sum rule|sum-rule' acquisition/diag/niro.txt > acquisition/diag/niro_renorm_context.txt || true
            else
              note "status=download_failed"
            fi
          else
            note "status=href_not_found"
          fi
          cat acquisition/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4d-niro-renormalization-source
          path: acquisition/
          retention-days: 7
