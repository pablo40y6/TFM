name: M4D source acquisition probe

on:
  push:
    branches: [milestone/m4d-design]
    paths: [.github/workflows/m4d-source-acquisition.yml]

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acquire Boulet 2014 Niro-renormalization witness
        shell: bash
        run: |
          set -eu
          mkdir -p acquisition/files
          url='https://ntrs.nasa.gov/api/citations/20140017696/downloads/20140017696.pdf?attachment=true'
          curl -fL --retry 3 --connect-timeout 20 --max-time 240 -A 'Mozilla/5.0' "$url" -o acquisition/files/boulet_ma_thibault_2014.pdf
          {
            printf 'url=%s\n' "$url"
            printf 'bytes=%s\n' "$(wc -c < acquisition/files/boulet_ma_thibault_2014.pdf)"
            printf 'sha256=%s\n' "$(sha256sum acquisition/files/boulet_ma_thibault_2014.pdf | awk '{print $1}')"
            file acquisition/files/boulet_ma_thibault_2014.pdf
          } > acquisition/MANIFEST.txt
          cat acquisition/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m4d-boulet-2014-renormalization
          path: acquisition/
          retention-days: 7
