name: M4D source acquisition probe

on:
  push:
    branches:
      - milestone/m4d-design
    paths:
      - .github/workflows/m4d-source-acquisition.yml

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acquire public historical sources
        shell: bash
        run: |
          set -u
          mkdir -p acquisition/files acquisition/diag
          : > acquisition/MANIFEST.txt
          note(){ printf '%s\n' "$*" | tee -a acquisition/MANIFEST.txt; }
          fetch_url(){ label="$1"; url="$2"; out="$3"; note ""; note "[$label]"; note "url=$url"; if curl -fL --retry 2 --connect-timeout 20 --max-time 240 -A 'Mozilla/5.0' "$url" -o "$out"; then note "status=downloaded"; note "bytes=$(wc -c < "$out")"; note "sha256=$(sha256sum "$out"|awk '{print $1}')"; note "file=$(file -b "$out")"; file "$out"|grep -qi text && note "lines=$(wc -l < "$out")"; return 0; else rm -f "$out"; note "status=failed"; return 1; fi; }
          note "access_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          base='https://lweb.cfa.harvard.edu/HITRAN/HITRAN2012/HITRAN2012/By-Molecule/Uncompressed-files'
          fetch_url A2 "$base/07_A-band_SDF.dat" acquisition/files/07_A-band_SDF.dat || true
          fetch_url A3 "$base/07_hit12_0.76mic_Galatry.par" acquisition/files/07_hit12_0.76mic_Galatry.par || true
          fetch_url A_HITRAN2012_FULL "$base/07_hit12.par" acquisition/files/07_hit12.par || true

          fetch_url A1_EUROPEPMC 'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5103325/supplementaryFiles' acquisition/diag/PMC5103325_supplementary.zip || true
          if [ -f acquisition/diag/PMC5103325_supplementary.zip ]; then
            mkdir -p acquisition/epmc_suppl
            unzip -q acquisition/diag/PMC5103325_supplementary.zip -d acquisition/epmc_suppl || true
            find acquisition/epmc_suppl -type f -printf '%P\t%s\n' > acquisition/diag/epmc_file_list.txt || true
            supp="$(find acquisition/epmc_suppl -type f -iname '*supplement*1*.pdf' -print -quit)"
            [ -z "$supp" ] && supp="$(find acquisition/epmc_suppl -type f -iname '*.pdf' -print -quit)"
            note "A1_supplement_path=$supp"
            if [ -n "$supp" ]; then
              cp "$supp" acquisition/files/NIHMS804415-supplement-supplement_1.pdf
              note "A1_bytes=$(wc -c < acquisition/files/NIHMS804415-supplement-supplement_1.pdf)"
              note "A1_sha256=$(sha256sum acquisition/files/NIHMS804415-supplement-supplement_1.pdf|awk '{print $1}')"
              pdfinfo acquisition/files/NIHMS804415-supplement-supplement_1.pdf > acquisition/diag/drouin_pdfinfo.txt 2>&1 || true
              pdftotext -layout acquisition/files/NIHMS804415-supplement-supplement_1.pdf acquisition/diag/drouin_supplement.txt 2>/dev/null || true
            fi
          fi

          fetch_url C1_CURRENT_2024 'https://hitran.org/data/CIA/O2-air_2024.cia' acquisition/files/O2-air_2024.cia || true
          fetch_url C1_NEGATIVE_CONTROL 'https://hitran.org/data/CIA/alternate/O2-Air_altern_2016.cia' acquisition/files/O2-Air_altern_2016.cia || true
          fetch_url C1_THEORY_2018 'https://hitran.org/data/CIA/alternate/O2-Air_theory_temp_2018.cia' acquisition/files/O2-Air_theory_temp_2018.cia || true

          note ""; note "[FINAL_FILE_HASHES]"
          find acquisition/files -maxdepth 1 -type f -print0 | sort -z | while IFS= read -r -d '' f; do note "$(basename "$f") bytes=$(wc -c < "$f") sha256=$(sha256sum "$f"|awk '{print $1}')"; done
          cat acquisition/MANIFEST.txt
      - name: Upload acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4d-source-acquisition-evidence-v2
          path: acquisition/
          retention-days: 7
