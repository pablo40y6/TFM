name: M4D source acquisition probe
on:
  push:
    branches: [milestone/m4d-design]
    paths: [.github/workflows/m4d-source-acquisition.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acquire exact Tran equation images
        shell: bash
        run: |
          set -u
          mkdir -p acquisition/files
          : > acquisition/MANIFEST.txt
          get(){ name="$1"; url="$2"; out="acquisition/files/$name"; echo "$name $url" >> acquisition/MANIFEST.txt; if curl -fL --retry 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' -e 'https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2005JD006869' "$url" -o "$out"; then echo "bytes=$(wc -c < "$out") sha256=$(sha256sum "$out"|awk '{print $1}') type=$(file -b "$out")" >> acquisition/MANIFEST.txt; else echo failed >> acquisition/MANIFEST.txt; rm -f "$out"; fi; }
          get eq09.gif 'https://agupubs.onlinelibrary.wiley.com/cms/asset/8790e726-0be2-4733-bc8e-e7f98c20ed61/jgrd12781-math-0016.gif'
          get eq12.gif 'https://agupubs.onlinelibrary.wiley.com/cms/asset/6c8fbfd3-4d9c-461e-b304-39f5238a8b7c/jgrd12781-math-0019.gif'
          get eqY.gif 'https://agupubs.onlinelibrary.wiley.com/cms/asset/d8619fc0-4f5d-4aa3-ad61-26674011b4b7c/jgrd12781-math-0031.gif'
          cat acquisition/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4d-tran-equation-images
          path: acquisition/
          retention-days: 7
