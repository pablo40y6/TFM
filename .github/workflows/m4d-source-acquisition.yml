name: M4D source acquisition probe

on:
  push:
    branches: [milestone/m4d-design]
    paths: [.github/workflows/m4d-source-acquisition.yml]

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Drouin supplement
        shell: bash
        run: |
          set -u
          mkdir -p acquisition/files acquisition/diag
          : > acquisition/MANIFEST.txt
          note(){ printf '%s\n' "$*" | tee -a acquisition/MANIFEST.txt; }
          try_url(){ label="$1"; url="$2"; out="$3"; note ""; note "[$label]"; note "url=$url"; if curl -fL --retry 1 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' "$url" -o "$out"; then note "status=downloaded"; note "bytes=$(wc -c < "$out")"; note "sha256=$(sha256sum "$out"|awk '{print $1}')"; note "type=$(file -b "$out")"; return 0; else rm -f "$out"; note "status=failed"; return 1; fi; }
          note "access_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          try_url PMC_HTML 'https://pmc.ncbi.nlm.nih.gov/articles/PMC5103325/' acquisition/diag/pmc.html || true
          if [ -f acquisition/diag/pmc.html ]; then
            grep -Eo 'https?://[^"'"'"' ]+supplement[^"'"'"' ]+\.pdf[^"'"'"' ]*|href="[^"]*supplement[^"]*\.pdf[^"]*"' acquisition/diag/pmc.html > acquisition/diag/pmc_supp_links.txt || true
            cat acquisition/diag/pmc_supp_links.txt | tee -a acquisition/MANIFEST.txt || true
          fi

          for url in \
            'https://pmc.ncbi.nlm.nih.gov/articles/PMC5103325/bin/NIHMS804415-supplement-supplement_1.pdf' \
            'https://pmc.ncbi.nlm.nih.gov/articles/PMC5103325/bin/NIHMS804415-supplement-supplement_1.pdf?download=1' \
            'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5103325/bin/NIHMS804415-supplement-supplement_1.pdf' \
            'https://pmc.ncbi.nlm.nih.gov/articles/instance/5103325/bin/NIHMS804415-supplement-supplement_1.pdf'; do
            if try_url A1_DIRECT "$url" acquisition/files/NIHMS804415-supplement-supplement_1.pdf; then
              if file acquisition/files/NIHMS804415-supplement-supplement_1.pdf | grep -qi PDF; then break; else rm -f acquisition/files/NIHMS804415-supplement-supplement_1.pdf; fi
            fi
          done

          if [ -f acquisition/files/NIHMS804415-supplement-supplement_1.pdf ]; then
            pdfinfo acquisition/files/NIHMS804415-supplement-supplement_1.pdf > acquisition/diag/drouin_pdfinfo.txt 2>&1 || true
            pdftotext -layout acquisition/files/NIHMS804415-supplement-supplement_1.pdf acquisition/diag/drouin_supplement.txt 2>/dev/null || true
          fi
          cat acquisition/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4d-drouin-supplement-probe
          path: acquisition/
          retention-days: 7
