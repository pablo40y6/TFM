name: M4D source acquisition probe

on:
  push:
    branches:
      - milestone/m4d-design
    paths:
      - .github/workflows/m4d-source-acquisition.yml

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current O2-Air Mate blocks
        shell: bash
        run: |
          set -eu
          mkdir -p acquisition
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 -A 'Mozilla/5.0' 'https://hitran.org/data/CIA/O2-air_2024.cia' -o acquisition/O2-air_2024.cia
          wc -c acquisition/O2-air_2024.cia | tee acquisition/size.txt
          sha256sum acquisition/O2-air_2024.cia | tee acquisition/sha256.txt
          head -n 100 acquisition/O2-air_2024.cia > acquisition/first100.txt
          grep -in -E '7450|8480|8488|253|273|296|Mate|MATE' acquisition/O2-air_2024.cia > acquisition/hits.txt || true
          head -n 120 acquisition/hits.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m4d-cia-current-mate-blocks
          path: acquisition/
          retention-days: 7
