name: M4D source acquisition probe

on:
  push:
    branches: [milestone/m4d-design]
    paths: [.github/workflows/m4d-source-acquisition.yml]

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acquire Drouin structured article and inspect CIA source links
        shell: bash
        run: |
          set -u
          mkdir -p acquisition/files acquisition/diag
          : > acquisition/MANIFEST.txt
          note(){ printf '%s\n' "$*" | tee -a acquisition/MANIFEST.txt; }
          fetch(){ label="$1"; url="$2"; out="$3"; note ""; note "[$label]"; note "url=$url"; if curl -fL --retry 2 --connect-timeout 20 --max-time 240 -A 'Mozilla/5.0' "$url" -o "$out"; then note "status=downloaded"; note "bytes=$(wc -c < "$out")"; note "sha256=$(sha256sum "$out"|awk '{print $1}')"; note "type=$(file -b "$out")"; return 0; else rm -f "$out"; note "status=failed"; return 1; fi; }
          note "access_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          fetch A1_ARTICLE_XML 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=5103325' acquisition/files/PMC5103325.xml || true
          if [ -f acquisition/files/PMC5103325.xml ]; then
            python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('acquisition/files/PMC5103325.xml').getroot(); print(r.tag); print('tables',len(r.findall('.//table-wrap'))); [print((tw.findtext('label') or ''),(tw.findtext('caption/title') or '')) for tw in r.findall('.//table-wrap')]" > acquisition/diag/article_table_index.txt || true
            python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('acquisition/files/PMC5103325.xml').getroot(); tw=[x for x in r.findall('.//table-wrap') if (x.findtext('label') or '').strip() in ('Table 4','Table 5')]; open('acquisition/diag/drouin_tables_4_5.txt','w',encoding='utf-8').write('\\n\\n'.join('### '+((x.findtext('label') or '').strip())+'\\n'+''.join(x.itertext()) for x in tw))" || true
          fi

          fetch HITRAN_CIA_PAGE 'https://hitran.org/cia/' acquisition/diag/hitran_cia.html || true
          if [ -f acquisition/diag/hitran_cia.html ]; then
            grep -Eoi 'href=["'"'][^"'"']*O2[^"'"']*Air[^"'"']*\.cia[^"'"']*["'"']' acquisition/diag/hitran_cia.html > acquisition/diag/o2_air_links.txt || true
            cat acquisition/diag/o2_air_links.txt | tee -a acquisition/MANIFEST.txt || true
          fi

          fetch HITRAN_CIA_INDEX 'https://hitran.org/data/CIA/' acquisition/diag/hitran_cia_index.html || true
          if [ -f acquisition/diag/hitran_cia_index.html ]; then
            grep -Eoi 'href=["'"'][^"'"']*O2[^"'"']*Air[^"'"']*\.cia[^"'"']*["'"']' acquisition/diag/hitran_cia_index.html > acquisition/diag/o2_air_index_links.txt || true
            cat acquisition/diag/o2_air_index_links.txt | tee -a acquisition/MANIFEST.txt || true
          fi
          cat acquisition/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4d-structured-source-probe
          path: acquisition/
          retention-days: 7
