name: Accepted temporal model validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev,background-gen]"
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Full tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Historical accepted validators
        run: |
          python scripts/validate_legacy.py
          python scripts/validate_local_closure.py
          python scripts/validate_odd_oxygen_photolysis_budget.py
          python scripts/validate_historical_2020_background.py
          python scripts/validate_historical_2020_uv.py
      - name: Immutable M4C artifact
        run: echo "2944c8a8e0899b320c69c45192ee6f03b9001114c4120a9db8c67a3f1bb8f1fe  artifacts/accepted/m4c-r2/tfm-photochem-milestone4c-r2.zip" | sha256sum --check
